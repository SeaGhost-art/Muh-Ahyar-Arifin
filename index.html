
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbandingan Jarak Rute</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            margin: 0;
            padding: 25px 15px;
            color: #263445;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #174b7a;
            font-size: 25px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #10558d;
        }

        #hasil {
            display: none;
            margin-top: 20px;
            padding: 17px;
            background: #eaf5ff;
            border-radius: 8px;
            text-align: center;
            line-height: 1.7;
        }

        .anggota {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid #ddd;
            text-align: center;
        }

        .anggota h3 {
            color: #174b7a;
            margin-bottom: 12px;
        }

        .anggota p {
            margin: 8px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Perbandingan Jarak Rute</h1>

        <p class="description">
            Program Menentukan Rute Terpendek
        </p>

        <label for="rute1">Masukkan Jarak Rute 1 (km)</label>
        <input
            type="number"
            id="rute1"
            placeholder="Contoh: 10"
            min="0"
            step="any"
        >

        <label for="rute2">Masukkan Jarak Rute 2 (km)</label>
        <input
            type="number"
            id="rute2"
            placeholder="Contoh: 15"
            min="0"
            step="any"
        >

        <button onclick="bandingkanRute()">
            Bandingkan Jarak
        </button>

        <div id="hasil"></div>

        <div class="anggota">
            <h3>Dibuat Oleh</h3>

            <p>Muh Ahyar Arifin</p>
            <p>Anugrah Salzabil</p>
        </div>

        <footer>
            Program Perbandingan Jarak Rute
        </footer>

    </div>

    <script>

        function bandingkanRute() {

            let jarak_rute1 = parseFloat(
                document.getElementById("rute1").value
            );

            let jarak_rute2 = parseFloat(
                document.getElementById("rute2").value
            );

            let hasil = document.getElementById("hasil");

            if (
                isNaN(jarak_rute1) ||
                isNaN(jarak_rute2) ||
                jarak_rute1 < 0 ||
                jarak_rute2 < 0
            ) {
                hasil.style.display = "block";
                hasil.innerHTML =
                    "Masukkan kedua jarak dengan angka yang valid.";
                return;
            }

            // Membandingkan jarak kedua rute

            if (jarak_rute1 < jarak_rute2) {

                hasil.innerHTML =
                    "<b>Rute 1 adalah rute terpendek.</b><br>" +
                    "Jarak: " + jarak_rute1 + " km";

            }

            else if (jarak_rute2 < jarak_rute1) {

                hasil.innerHTML =
                    "<b>Rute 2 adalah rute terpendek.</b><br>" +
                    "Jarak: " + jarak_rute2 + " km";

            }

            else {

                hasil.innerHTML =
                    "<b>Kedua rute memiliki jarak yang sama.</b><br>" +
                    "Jarak: " + jarak_rute1 + " km";

            }

            hasil.style.display = "block";

        }

    </script>

</body>
</html>
